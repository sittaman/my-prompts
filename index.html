<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&display=swap" rel="stylesheet">
  <style>
    :root,
    [data-theme="light"] {
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f3f0ec;
      --color-surface-dynamic: #e6e4df;
      --color-border: #d4d1ca;
      --color-divider: #dcd9d5;
      --color-text: #28251d;
      --color-text-muted: #7a7974;
      --color-text-faint: #bab9b4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-active: #0f3638;
      --color-primary-highlight: #cedcd8;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-body: 'Inter', system-ui, sans-serif;
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
    }

    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #201f1d;
      --color-surface-offset: #1d1c1a;
      --color-surface-dynamic: #2d2c2a;
      --color-border: #393836;
      --color-divider: #262523;
      --color-text: #cdccca;
      --color-text-muted: #797876;
      --color-text-faint: #5a5957;
      --color-primary: #4f98a3;
      --color-primary-hover: #227f8b;
      --color-primary-active: #1a626b;
      --color-primary-highlight: #313b3b;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #171614;
        --color-surface: #1c1b19;
        --color-surface-2: #201f1d;
        --color-surface-offset: #1d1c1a;
        --color-surface-dynamic: #2d2c2a;
        --color-border: #393836;
        --color-divider: #262523;
        --color-text: #cdccca;
        --color-text-muted: #797876;
        --color-text-faint: #5a5957;
        --color-primary: #4f98a3;
        --color-primary-hover: #227f8b;
        --color-primary-active: #1a626b;
        --color-primary-highlight: #313b3b;
        --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
        --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-10) var(--space-4) var(--space-16);
      transition: background-color var(--transition), color var(--transition);
    }

    a,
    button,
    [role="button"] {
      transition: color var(--transition), background var(--transition),
        border-color var(--transition), box-shadow var(--transition);
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Page wrapper ── */
    .page-wrapper {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: var(--space-10);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .brand-text .title {
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--color-text);
      line-height: 1.2;
    }

    .brand-text .subtitle {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: 3px;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      color: var(--color-text);
      background: var(--color-surface-offset);
    }

    .theme-toggle:active {
      background: var(--color-border);
    }

    /* ── Section heading ── */
    .section-heading {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .section-heading h2 {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .section-heading .line {
      flex: 1;
      height: 1px;
      background: var(--color-divider);
    }

    /* ── Prompt cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
    }

    /* ── Prompt card (active) ── */
    .prompt-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      border-radius: var(--radius-xl);
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .prompt-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: oklch(from var(--color-primary) l c h / 0);
      transition: background var(--transition);
      border-radius: inherit;
    }

    .prompt-card:hover::before {
      background: oklch(from var(--color-primary) l c h / 0.04);
    }

    .prompt-card:hover {
      border-color: oklch(from var(--color-primary) l c h / 0.3);
      box-shadow: var(--shadow-md);
    }

    .prompt-card:active {
      box-shadow: var(--shadow-sm);
    }

    .card-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-lg);
      background: var(--color-primary-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-primary);
      transition: background var(--transition);
    }

    .prompt-card:hover .card-icon-wrap {
      background: color-mix(in oklch, var(--color-primary) 18%, var(--color-surface));
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.3;
    }

    .card-desc {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: var(--space-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      color: var(--color-text-faint);
      flex-shrink: 0;
      transition: color var(--transition), transform var(--transition);
    }

    .prompt-card:hover .card-arrow {
      color: var(--color-primary);
      transform: translateX(3px);
    }

    /* ── Coming soon card ── */
    .prompt-card-soon {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      background: var(--color-surface);
      border: 1px dashed var(--color-divider);
      border-radius: var(--radius-xl);
      opacity: 0.55;
      cursor: default;
      user-select: none;
    }

    .soon-icon-wrap {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-lg);
      background: var(--color-surface-offset);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-text-faint);
    }

    .soon-body {
      flex: 1;
      min-width: 0;
    }

    .soon-title {
      font-size: var(--text-base);
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .soon-badge {
      display: inline-flex;
      align-items: center;
      margin-top: var(--space-1);
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--color-text-faint);
      background: var(--color-surface-offset);
      letter-spacing: 0.04em;
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      padding: var(--space-4) var(--space-5);
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-text) l c h / 0.07);
      border-radius: var(--radius-xl);
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    .stat-divider {
      width: 1px;
      height: 28px;
      background: var(--color-divider);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--color-text-faint);
    }
  </style>
</head>

<body>

  <main class="page-wrapper" role="main">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" aria-label="Prompt Library"
          xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="11" fill="var(--color-primary)" />
          <!-- Book pages -->
          <rect x="11" y="10" width="8" height="20" rx="1.5" fill="white" opacity="0.25" />
          <rect x="21" y="10" width="8" height="20" rx="1.5" fill="white" opacity="0.55" />
          <!-- Lines on right page -->
          <rect x="23" y="14" width="4" height="1.5" rx="0.75" fill="white" opacity="0.9" />
          <rect x="23" y="17.5" width="4" height="1.5" rx="0.75" fill="white" opacity="0.7" />
          <rect x="23" y="21" width="2.5" height="1.5" rx="0.75" fill="white" opacity="0.7" />
          <!-- Spine line -->
          <rect x="19.5" y="10" width="1" height="20" rx="0.5" fill="white" opacity="0.4" />
        </svg>
        <div class="brand-text">
          <div class="title">Prompt Library</div>
          <div class="subtitle">Coleção de prompts para o app da Perplexity</div>
        </div>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </header>

    <!-- Stats -->
    <div class="stats-bar" role="region" aria-label="Estatísticas">
      <div class="stat">
        <span class="stat-value" id="statActive">1</span>
        <span class="stat-label">Disponível</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="statSoon">3</span>
        <span class="stat-label">Em breve</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="statTotal">4</span>
        <span class="stat-label">Total planejado</span>
      </div>
    </div>

    <!-- Active prompts -->
    <section aria-labelledby="section-active">
      <div class="section-heading">
        <h2 id="section-active">Prompts disponíveis</h2>
        <div class="line"></div>
      </div>
      <div class="cards-grid">

        <a href="./article-prompt-generator.html" class="prompt-card" rel="noopener">
          <div class="card-icon-wrap" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 10h16M4 14h10" />
              <circle cx="19" cy="17" r="3" />
              <path d="m21.5 19.5-1.5-1.5" />
            </svg>
          </div>
          <div class="card-body">
            <div class="card-title">Leitura de Artigos</div>
            <div class="card-desc">Transforma matérias e artigos em narração para ouvir no app</div>
          </div>
          <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </a>

      </div>
    </section>

    <footer class="footer" role="contentinfo">
      Prompt Library · Perplexity app · Português brasileiro
    </footer>

  </main>

  <script>
    (function () {
      const toggle = document.querySelector('[data-theme-toggle]');
      const root = document.documentElement;
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      updateIcon();

      toggle.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
        updateIcon();
      });

      function updateIcon() {
        toggle.setAttribute('aria-label', 'Alternar para tema ' + (theme === 'dark' ? 'claro' : 'escuro'));
        toggle.innerHTML = theme === 'dark'
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }
    })();
  </script>
</body>

</html>
